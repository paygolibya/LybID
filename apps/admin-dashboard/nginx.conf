# Serves the built SPA. try_files falls back to index.html for any path
# that isn't a real static file — required for React Router's client-side
# routes (e.g. /tenants/:id) to work on a hard refresh or a direct link,
# not just client-side navigation from the root.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames (Vite's default) are safe to cache
    # aggressively; index.html itself must not be, or a redeploy wouldn't
    # be picked up until the cache expired.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
