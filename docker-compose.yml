services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lybid_owner
      POSTGRES_PASSWORD: lybid_owner_dev_password
      POSTGRES_DB: lybid
    ports:
      - "5432:5432"
    volumes:
      - lybid_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lybid_owner -d lybid"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - lybid_redis_data:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lybid_minio
      MINIO_ROOT_PASSWORD: lybid_minio_dev_password
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - lybid_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  ocr:
    build: services/ocr
    restart: unless-stopped
    # No published ports — reachable only from other containers on this
    # network (apps/api), never from the host. See the Phase 1 plan for why
    # the OCR sidecar is kept unreachable from outside.
    expose:
      - "8000"

volumes:
  lybid_postgres_data:
  lybid_redis_data:
  lybid_minio_data:
