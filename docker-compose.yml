services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lybid_owner
      POSTGRES_PASSWORD: lybid_owner_dev_password
      POSTGRES_DB: lybid
    ports:
      - "5432:5432"
    volumes:
      - lybid_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lybid_owner -d lybid"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lybid_postgres_data:
